<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="blueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <pattern id="circGrid" width="35" height="35" patternUnits="userSpaceOnUse">
      <circle cx="17.5" cy="17.5" r="1" fill="rgba(96, 165, 250, 0.2)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#blueBg)"/>
  <rect width="100%" height="100%" fill="url(#circGrid)"/>

  <!-- System Diagram / Vector Art -->
  <g transform="translate(600, 420)">
    <!-- ESP8266 Core Hub -->
    <rect x="-100" y="-80" width="200" height="160" rx="14" fill="rgba(30, 58, 138, 0.4)" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="-70" y="-55" width="140" height="70" rx="6" fill="#1E293B" stroke="#60A5FA"/>
    <text x="0" y="-20" fill="#93C5FD" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ESP8266</text>
    <text x="0" y="3" fill="#60A5FA" font-family="monospace" font-size="11" text-anchor="middle">802.11 b/g/n IoT</text>
    <text x="0" y="45" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">UNIFIED CONTROLLER</text>

    <!-- 433 MHz RF Pathway (Left) -->
    <g transform="translate(-220, 0)">
      <line x1="120" y1="0" x2="30" y2="0" stroke="#38BDF8" stroke-width="2.5"/>
      <rect x="-140" y="-60" width="170" height="120" rx="10" fill="rgba(14, 165, 233, 0.15)" stroke="#38BDF8" stroke-width="2"/>
      <text x="-55" y="-25" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">LM3046 ARRAY</text>
      <text x="-55" y="-5" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle">5x NPN Low-Side</text>
      <text x="-55" y="25" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">433 MHz RF Matrix</text>
      
      <!-- Radio Waves -->
      <path d="M -160 -20 A 30 30 0 0 0 -160 20" fill="none" stroke="#38BDF8" stroke-width="2"/>
      <path d="M -175 -35 A 50 50 0 0 0 -175 35" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M -190 -50 A 70 70 0 0 0 -190 50" fill="none" stroke="#38BDF8" stroke-width="1"/>
    </g>

    <!-- 940 nm IR Pathway (Right) -->
    <g transform="translate(220, 0)">
      <line x1="-120" y1="0" x2="-30" y2="0" stroke="#F43F5E" stroke-width="2.5"/>
      <rect x="-30" y="-60" width="170" height="120" rx="10" fill="rgba(244, 63, 94, 0.15)" stroke="#F43F5E" stroke-width="2"/>
      <text x="55" y="-25" fill="#FB7185" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">940 nm IR LED</text>
      <text x="55" y="-5" fill="#FECDD3" font-family="monospace" font-size="11" text-anchor="middle">NEC + Custom Pulse</text>
      <text x="55" y="25" fill="#94A3B8" font-family="monospace" font-size="10" text-anchor="middle">Line-of-Sight Blast</text>

      <!-- Optical Rays -->
      <line x1="145" y1="0" x2="190" y2="0" stroke="#FB7185" stroke-width="2" stroke-dasharray="4,4"/>
      <line x1="145" y1="-15" x2="185" y2="-30" stroke="#FB7185" stroke-width="1.5" stroke-dasharray="4,4"/>
      <line x1="145" y1="15" x2="185" y2="30" stroke="#FB7185" stroke-width="1.5" stroke-dasharray="4,4"/>
    </g>
  </g>

  <!-- Titles -->
  <text x="60" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800">Unified Smart Lighting Hub</text>
  <text x="60" y="125" fill="#60A5FA" font-family="monospace" font-size="16">ESP8266 // REVERSE-ENGINEERED 433 MHz RF &amp; 940 nm OPTICAL IR</text>

  <!-- Tech Badges -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="rgba(59, 130, 246, 0.2)" stroke="#3B82F6"/>
    <text x="45" y="18" fill="#93C5FD" font-family="monospace" font-size="11" text-anchor="middle">ESP8266</text>

    <rect x="100" y="0" width="120" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8"/>
    <text x="160" y="18" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle">433 MHz RF</text>

    <rect x="230" y="0" width="130" height="28" rx="14" fill="rgba(244, 63, 94, 0.2)" stroke="#F43F5E"/>
    <text x="295" y="18" fill="#FECDD3" font-family="monospace" font-size="11" text-anchor="middle">940 nm OPTICAL</text>
  </g>
</svg>
