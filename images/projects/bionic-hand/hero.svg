<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#181330"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(139, 92, 246, 0.12)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- Mechanical Hand Vector Schematics -->
  <g transform="translate(600, 380)" stroke="#8B5CF6" stroke-width="2" fill="none" opacity="0.85">
    <!-- Forearm Base -->
    <rect x="-140" y="140" width="280" height="180" rx="16" fill="rgba(139, 92, 246, 0.08)" stroke="#A78BFA" stroke-dasharray="4,4"/>
    <text x="0" y="230" fill="#DDD6FE" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="2">SERVO ACTUATOR BAY (7x MG90S)</text>
    <text x="0" y="255" fill="#A78BFA" font-family="monospace" font-size="12" text-anchor="middle">50 Hz PWM CONTROL // MSP432</text>
    
    <!-- Palm Structure -->
    <path d="M -110 140 L -90 -20 L 90 -20 L 110 140 Z" fill="rgba(139, 92, 246, 0.15)" stroke="#C084FC" stroke-width="2.5"/>
    <circle cx="0" cy="50" r="30" fill="rgba(192, 132, 252, 0.2)" stroke="#C084FC"/>
    <text x="0" y="55" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SNAP-FIT HUB</text>
    
    <!-- Thumb (Articulated 3-DOF) -->
    <g transform="translate(-85, 30)">
      <line x1="0" y1="0" x2="-60" y2="-40" stroke="#F472B6" stroke-width="4"/>
      <circle cx="-60" cy="-40" r="7" fill="#F472B6"/>
      <line x1="-60" y1="-40" x2="-100" y2="-70" stroke="#F472B6" stroke-width="3"/>
      <circle cx="-100" cy="-70" r="5" fill="#F472B6"/>
      <line x1="-100" y1="-70" x2="-130" y2="-90" stroke="#F472B6" stroke-width="2"/>
      <text x="-140" y="-105" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle">THUMB 3-DOF</text>
    </g>
    
    <!-- Index Finger -->
    <g transform="translate(-60, -20)">
      <line x1="0" y1="0" x2="-20" y2="-80" stroke="#8B5CF6" stroke-width="4"/>
      <circle cx="-20" cy="-80" r="6" fill="#8B5CF6"/>
      <line x1="-20" y1="-80" x2="-25" y2="-150" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="-25" cy="-150" r="5" fill="#8B5CF6"/>
      <line x1="-25" y1="-150" x2="-25" y2="-200" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="-25" cy="-200" r="4" fill="#C084FC"/>
    </g>
    
    <!-- Middle Finger -->
    <g transform="translate(-15, -20)">
      <line x1="0" y1="0" x2="-5" y2="-90" stroke="#8B5CF6" stroke-width="4"/>
      <circle cx="-5" cy="-90" r="6" fill="#8B5CF6"/>
      <line x1="-5" y1="-90" x2="-5" y2="-170" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="-5" cy="-170" r="5" fill="#8B5CF6"/>
      <line x1="-5" y1="-170" x2="-5" y2="-225" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="-5" cy="-225" r="4" fill="#C084FC"/>
    </g>
    
    <!-- Ring Finger -->
    <g transform="translate(25, -20)">
      <line x1="0" y1="0" x2="15" y2="-80" stroke="#8B5CF6" stroke-width="4"/>
      <circle cx="15" cy="-80" r="6" fill="#8B5CF6"/>
      <line x1="15" y1="-80" x2="20" y2="-150" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="20" cy="-150" r="5" fill="#8B5CF6"/>
      <line x1="20" y1="-150" x2="20" y2="-200" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="20" cy="-200" r="4" fill="#C084FC"/>
    </g>
    
    <!-- Pinky Finger -->
    <g transform="translate(65, -20)">
      <line x1="0" y1="0" x2="35" y2="-65" stroke="#8B5CF6" stroke-width="4"/>
      <circle cx="35" cy="-65" r="6" fill="#8B5CF6"/>
      <line x1="35" y1="-65" x2="45" y2="-120" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="45" cy="-120" r="5" fill="#8B5CF6"/>
      <line x1="45" y1="-120" x2="50" y2="-165" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="50" cy="-165" r="4" fill="#C084FC"/>
    </g>
    
    <!-- Dyneema Routing Paths -->
    <path d="M 0 140 Q -30 60 -25 -200" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 0 140 Q 0 60 -5 -225" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 0 140 Q 30 60 20 -200" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 0 140 Q 50 60 50 -165" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <path d="M 0 140 Q -60 70 -130 -90" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Header Text -->
  <text x="60" y="90" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">BioWare 2.0 // 7-DOF Bionic Hand</text>
  <text x="60" y="125" fill="#A78BFA" font-family="monospace" font-size="16" letter-spacing="1">ANTHROPOMORPHIC TENDON-ACTUATED END-EFFECTOR</text>
  
  <!-- Tech Badges -->
  <g transform="translate(60, 150)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8B5CF6"/>
    <text x="45" y="18" fill="#DDD6FE" font-family="monospace" font-size="11" text-anchor="middle">&lt;450g MASS</text>
    
    <rect x="100" y="0" width="115" height="28" rx="14" fill="rgba(56, 189, 248, 0.2)" stroke="#38BDF8"/>
    <text x="157" y="18" fill="#BAE6FD" font-family="monospace" font-size="11" text-anchor="middle">DYNEEMA 0.5mm</text>
    
    <rect x="225" y="0" width="130" height="28" rx="14" fill="rgba(244, 114, 182, 0.2)" stroke="#F472B6"/>
    <text x="290" y="18" fill="#FBCFE8" font-family="monospace" font-size="11" text-anchor="middle">SUB-100ms CYCLE</text>
  </g>
</svg>
