<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="schemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#schemBg)"/>

  <text x="50" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Base-Drive Anti-Latching Resistor Network</text>
  <text x="50" y="80" fill="#60A5FA" font-family="monospace" font-size="12">1 kΩ SERIES LIMITER // 10 kΩ PULL-DOWN TO GND // COMMON RAIL</text>

  <!-- Circuit Schematic Diagram -->
  <g transform="translate(80, 140)">
    <!-- ESP32 GPIO Box -->
    <rect x="0" y="50" width="120" height="200" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="60" y="85" fill="#60A5FA" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">ESP32</text>
    <text x="60" y="140" fill="#E2E8F0" font-family="monospace" font-size="12" text-anchor="middle">GPIO_12</text>
    <circle cx="120" cy="135" r="4" fill="#3B82F6"/>

    <!-- Wire to 1k Resistor -->
    <line x1="124" y1="135" x2="200" y2="135" stroke="#94A3B8" stroke-width="2"/>

    <!-- 1k Resistor Symbol -->
    <rect x="200" y="125" width="60" height="20" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
    <text x="230" y="139" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">1 kΩ</text>

    <!-- Wire to junction -->
    <line x1="260" y1="135" x2="330" y2="135" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="330" cy="135" r="5" fill="#38BDF8"/>

    <!-- 10k Pull-down to GND -->
    <line x1="330" y1="135" x2="330" y2="200" stroke="#94A3B8" stroke-width="2"/>
    <rect x="320" y="200" width="20" height="50" fill="#334155" stroke="#F59E0B" stroke-width="2"/>
    <text x="360" y="230" fill="#FDE68A" font-family="monospace" font-size="11">10 kΩ</text>
    <line x1="330" y1="250" x2="330" y2="280" stroke="#94A3B8" stroke-width="2"/>
    <!-- Ground Symbol -->
    <line x1="315" y1="280" x2="345" y2="280" stroke="#94A3B8" stroke-width="2"/>
    <line x1="322" y1="286" x2="338" y2="286" stroke="#94A3B8" stroke-width="2"/>
    <line x1="327" y1="292" x2="333" y2="292" stroke="#94A3B8" stroke-width="2"/>
    <text x="330" y="315" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">GND</text>

    <!-- Wire to LM3046 Base -->
    <line x1="330" y1="135" x2="440" y2="135" stroke="#94A3B8" stroke-width="2"/>

    <!-- NPN Transistor (LM3046) -->
    <g transform="translate(440, 135)">
      <circle cx="30" cy="0" r="35" fill="rgba(56, 189, 248, 0.1)" stroke="#38BDF8" stroke-width="2"/>
      <!-- Base Line -->
      <line x1="10" y1="-20" x2="10" y2="20" stroke="#38BDF8" stroke-width="3"/>
      <line x1="0" y1="0" x2="10" y2="0" stroke="#94A3B8" stroke-width="2"/>
      
      <!-- Collector -->
      <line x1="10" y1="-10" x2="40" y2="-25" stroke="#94A3B8" stroke-width="2"/>
      <line x1="40" y1="-25" x2="40" y2="-60" stroke="#94A3B8" stroke-width="2"/>
      
      <!-- Emitter with arrow -->
      <line x1="10" y1="10" x2="40" y2="25" stroke="#94A3B8" stroke-width="2"/>
      <polygon points="35,22 25,14 30,28" fill="#38BDF8"/>
      <line x1="40" y1="25" x2="40" y2="60" stroke="#94A3B8" stroke-width="2"/>
      <!-- Emitter to GND -->
      <line x1="40" y1="60" x2="40" y2="90" stroke="#94A3B8" stroke-width="2"/>
      <line x1="25" y1="90" x2="55" y2="90" stroke="#94A3B8" stroke-width="2"/>
      <line x1="32" y1="96" x2="48" y2="96" stroke="#94A3B8" stroke-width="2"/>
      <text x="40" y="115" fill="#64748B" font-family="monospace" font-size="11" text-anchor="middle">GND</text>
      
      <text x="30" y="-80" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LM3046 (1/5)</text>
    </g>

    <!-- RF Remote Button Contact (Collector side) -->
    <g transform="translate(480, 50)">
      <line x1="0" y1="25" x2="80" y2="25" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="80" cy="25" r="5" fill="#F59E0B"/>
      <text x="95" y="30" fill="#FDE68A" font-family="monospace" font-size="12">Scraped RF Button Pad (Pull-Down)</text>
    </g>
  </g>
  
  <rect x="50" y="510" width="700" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155"/>
  <text x="400" y="535" fill="#CBD5E1" font-family="sans-serif" font-size="12" text-anchor="middle">Prevents floating pin states during ESP32 bootup // Prevents unintended RF transmitter latching</text>
</svg>
