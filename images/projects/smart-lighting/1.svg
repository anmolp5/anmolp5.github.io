<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pcbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#pcbBg)"/>
  
  <text x="50" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">RF Remote PCB // Button Matrix Trace Tapping</text>
  <text x="50" y="80" fill="#34D399" font-family="monospace" font-size="12">BARE-COPPER SCRAPED PADS &amp; LOW-SIDE TRANSISTOR INTERFACE</text>

  <!-- PCB Representation -->
  <g transform="translate(100, 130)">
    <rect x="0" y="0" width="600" height="400" rx="12" fill="#065f46" stroke="#047857" stroke-width="3"/>
    
    <!-- 5 Scraped Button Matrix Contacts -->
    {[0, 1, 2, 3, 4].map((i) => '')}
    <!-- Button 1 -->
    <g transform="translate(60, 60)">
      <circle cx="40" cy="40" r="35" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <path d="M 15 40 H 65 M 40 15 V 65" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#d97706"/>
      <text x="40" y="95" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">BTN 1 (PWR)</text>
      <!-- Solder Lead -->
      <line x1="40" y1="40" x2="40" y2="220" stroke="#E2E8F0" stroke-width="3"/>
    </g>

    <!-- Button 2 -->
    <g transform="translate(170, 60)">
      <circle cx="40" cy="40" r="35" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#d97706"/>
      <text x="40" y="95" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">BTN 2 (BRI+)</text>
      <line x1="40" y1="40" x2="40" y2="220" stroke="#E2E8F0" stroke-width="3"/>
    </g>

    <!-- Button 3 -->
    <g transform="translate(280, 60)">
      <circle cx="40" cy="40" r="35" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#d97706"/>
      <text x="40" y="95" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">BTN 3 (BRI-)</text>
      <line x1="40" y1="40" x2="40" y2="220" stroke="#E2E8F0" stroke-width="3"/>
    </g>

    <!-- Button 4 -->
    <g transform="translate(390, 60)">
      <circle cx="40" cy="40" r="35" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#d97706"/>
      <text x="40" y="95" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">BTN 4 (COL+)</text>
      <line x1="40" y1="40" x2="40" y2="220" stroke="#E2E8F0" stroke-width="3"/>
    </g>

    <!-- Button 5 -->
    <g transform="translate(500, 60)">
      <circle cx="40" cy="40" r="35" fill="#b45309" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="40" cy="40" r="8" fill="#d97706"/>
      <text x="40" y="95" fill="#FDE68A" font-family="monospace" font-size="11" text-anchor="middle">BTN 5 (COL-)</text>
      <line x1="40" y1="40" x2="40" y2="220" stroke="#E2E8F0" stroke-width="3"/>
    </g>

    <!-- Lead Bundle Bus to Transistor Array -->
    <rect x="40" y="280" width="520" height="90" rx="8" fill="#0f172a" stroke="#38BDF8"/>
    <text x="300" y="320" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">To LM3046 Open-Collector Transistor Array</text>
    <text x="300" y="345" fill="#94A3B8" font-family="monospace" font-size="11" text-anchor="middle">Active-Low Pulldown Simulation // Zero Voltage Contact Degradation</text>
  </g>
</svg>
